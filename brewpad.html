<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="BrewPad">
  <meta name="robots" content="noindex">
  <title>BrewPad | Steins &amp; Vines</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Lato:wght@300;400;700&display=swap" rel="stylesheet">
  <link rel="icon" href="favicon.ico">
  <link rel="apple-touch-icon" href="images/apple-touch-icon.png">
  <link rel="stylesheet" href="css/brewpad.min.css?v=mtj2nxvw">
  <script src="js/lib/constants.js"></script>
  <script src="js/lib/utils.js"></script>
  <script src="js/lib/auth.js"></script>
  <script src="js/lib/recipe-grouping.js"></script>
  <script src="js/sheets-config.js"></script>
  <script src="js/admin-config.js"></script>
  <script src="js/vendor/qrcode.min.js"></script>
  <script src="js/vendor/jspdf.umd.min.js"></script>
  <script src="https://accounts.google.com/gsi/client" async></script>
  <script src="js/brewpad.min.js?v=mtj2nxvw"></script>
</head>
<body>

  <!-- Toast overlay -->
  <div id="bp-toast-container" class="bp-toast-container"></div>

  <!-- Sign-in screen -->
  <div id="bp-signin">
    <div class="bp-signin-card">
      <img src="images/SV_Logo_Wordmark_green.svg" alt="Steins &amp; Vines" class="bp-signin-logo">
      <h1>BrewPad</h1>
      <p>Staff sign-in required</p>
      <div id="bp-google-signin-btn"></div>
      <p id="bp-denied-msg" class="bp-denied-msg" style="display:none;">Access denied. Your account is not authorised to use BrewPad.</p>
    </div>
  </div>

  <!-- App shell -->
  <div id="bp-app" style="display:none;">

    <!-- Shell bar -->
    <div class="bp-shell-bar">
      <div class="bp-shell-brand">
        <img src="images/SV_Logo_Wordmark_green.svg" alt="Steins &amp; Vines">
        <span>BrewPad</span>
      </div>
      <div class="bp-shell-user">
        <span id="bp-auth-dot" class="bp-auth-dot bp-auth-dot--offline" title="Not signed in"></span>
        <span id="bp-user-email"></span>
        <button type="button" class="btn-secondary bp-btn-sm" id="bp-clear-cache" title="Clear app cache and reload">&#8635;</button>
        <button type="button" class="btn-secondary bp-btn-sm" id="bp-signout">Sign Out</button>
      </div>
    </div>

    <!-- Panel host (fills between shell bar and tab bar) -->
    <div class="bp-panels">

      <!-- Dashboard panel -->
      <div id="bp-panel-dashboard" class="bp-panel">
        <div class="bp-panel-inner" id="bp-dashboard-inner" aria-live="polite" aria-atomic="false">
          <div class="bp-skeleton-block"></div>
          <div class="bp-skeleton-block" style="height:120px;margin-top:12px;"></div>
        </div>
      </div>

      <!-- Batches panel -->
      <div id="bp-panel-batches" class="bp-panel bp-batches-panel" style="display:none;">
        <div class="bp-batches-layout">
          <!-- List pane -->
          <div class="bp-batch-list-pane" id="bp-batch-list-pane" aria-live="polite" aria-atomic="false">
            <div class="bp-panel-inner">
              <div class="bp-skeleton-block"></div>
              <div class="bp-skeleton-block" style="margin-top:8px;"></div>
            </div>
          </div>
          <!-- Detail pane (landscape: right column; portrait: overlay) -->
          <div class="bp-batch-detail-pane" id="bp-batch-detail-pane" style="display:none;"></div>
        </div>
        <!-- Create batch bottom sheet -->
        <div class="bp-create-sheet" id="bp-create-sheet" role="dialog" aria-modal="true" aria-label="Create Batch" style="display:none;">
          <div class="bp-create-sheet-inner" id="bp-create-sheet-inner"></div>
        </div>
        <!-- Schedule editor bottom sheet -->
        <div class="bp-sched-sheet" id="bp-sched-sheet" role="dialog" aria-modal="true" aria-label="Schedule Editor" style="display:none;">
          <div class="bp-sched-sheet-inner" id="bp-sched-sheet-inner"></div>
        </div>
        <!-- Recipe attach expanded panel (Phase 36 / GAP-5) — template fragment.
             wireAttachExpandedPanel clones this content into sectionBodyEl (inside the
             scrollable .bp-batch-detail-pane) so it is never clipped by
             .bp-batches-panel { overflow:hidden }. -->
        <template id="bp-recipe-attach-expanded-tpl">
          <!-- Target volume control (ported Phase 35 / D-01) + ×factor (GAP-3, 36-11) -->
          <div id="bp-recipe-volume-wrap" style="display:none;">
            <div class="bp-volume-row">
              <label class="bp-volume-label">
                Target volume (L):
                <input type="number" id="bp-target-volume" class="bp-input bp-volume-input" min="0.5" step="0.5" inputmode="decimal" />
              </label>
              <label class="bp-volume-label">
                &times; factor
                <input type="number" id="bp-target-factor" class="bp-input bp-volume-input" min="0.1" step="0.1" inputmode="decimal" />
              </label>
            </div>
            <div id="bp-scale-factor-readout" class="bp-scale-readout"></div>
          </div>
          <!-- Ingredient modification panel (MOD-01 / D-03) -->
          <div id="bp-recipe-modify-wrap" style="display:none;">
            <button type="button" class="btn-secondary bp-btn-sm" id="bp-modify-toggle">Modify Ingredients</button>
            <div id="bp-modify-panel" style="display:none;">
              <table class="bp-recipe-modify-table">
                <tbody id="bp-modify-tbody"></tbody>
              </table>
              <button type="button" class="btn-secondary bp-btn-sm" id="bp-modify-add-row">+ Add Ingredient</button>
            </div>
          </div>
          <!-- Soft stock advisory (D-11) — non-blocking; Attach button never disabled by stock -->
          <div id="bp-recipe-stock-advisory" class="bp-toast--warning" style="display:none;"></div>
          <!-- Attach Recipe button -->
          <button type="button" class="btn bp-btn-sm" id="bp-recipe-attach-confirm-btn" style="display:none;">Attach Recipe</button>
          <!-- Save-as-new affordance (MOD-03 / D-14) — visible only when modifications exist -->
          <div id="bp-save-as-new-wrap" style="display:none;">
            <button type="button" class="btn-secondary bp-btn-sm" id="bp-save-as-new-btn">Save as new recipe</button>
            <div id="bp-save-as-new-prompt" style="display:none;">
              <input type="text" id="bp-new-recipe-name" class="bp-input" placeholder="e.g. My Custom Pale Ale" />
              <button type="button" class="btn bp-btn-sm" id="bp-save-draft-btn">Save Draft</button>
              <button type="button" class="btn-secondary bp-btn-sm" id="bp-save-cancel-btn">Cancel</button>
            </div>
          </div>
        </template>
      </div>

      <!-- Tasks panel -->
      <div id="bp-panel-tasks" class="bp-panel" style="display:none;">
        <div class="bp-panel-inner" id="bp-tasks-inner" aria-live="polite" aria-atomic="false">
          <div class="bp-skeleton-block"></div>
        </div>
      </div>

      <!-- Measurements panel -->
      <div id="bp-panel-measurements" class="bp-panel" style="display:none;">
        <div class="bp-panel-inner" id="bp-measurements-inner" aria-live="polite" aria-atomic="false">
          <div class="bp-skeleton-block"></div>
        </div>
      </div>

      <!-- Recipes panel -->
      <div id="bp-panel-recipes" class="bp-panel" style="display:none;">

        <!-- List subview -->
        <div id="bp-recipes-list-view">
          <div class="bp-panel-header">
            <h2>Recipes</h2>
            <div class="bp-panel-actions">
              <button type="button" class="btn" id="bp-recipes-new-btn">+ New Recipe</button>
            </div>
          </div>
          <div class="bp-panel-inner" id="bp-recipes-inner" aria-live="polite" aria-atomic="false">
            <div class="bp-skeleton-block"></div>
          </div>
        </div>

        <!-- Detail/editor subview (hidden by default) -->
        <div id="bp-recipes-detail-view" style="display:none;">
          <div class="bp-panel-header">
            <button type="button" class="btn-secondary" id="bp-recipes-back-btn">&larr; Back</button>
            <h2 id="bp-recipe-detail-title">Recipe</h2>
          </div>
          <div id="bp-recipes-availability-banner" class="bp-recipes-availability-banner" aria-live="polite"></div>
          <div class="bp-panel-inner bp-recipes-editor-inner">

            <!-- Metadata grid -->
            <div class="bp-recipes-form-grid">
              <div class="bp-recipes-form-field">
                <label for="bp-recipe-name">Name</label>
                <input type="text" id="bp-recipe-name" class="bp-input" placeholder="e.g. Pale Ale" />
              </div>
              <div class="bp-recipes-form-field">
                <label for="bp-recipe-style">Style</label>
                <input type="text" id="bp-recipe-style" class="bp-input" placeholder="e.g. American Pale Ale" />
              </div>
              <div class="bp-recipes-form-field bp-recipes-form-field--full">
                <label for="bp-recipe-description">Description</label>
                <textarea id="bp-recipe-description" class="bp-input" rows="2" placeholder="Optional notes"></textarea>
              </div>
            </div>
            <div class="bp-recipes-form-grid bp-recipes-form-grid--narrow">
              <div class="bp-recipes-form-field">
                <label for="bp-recipe-batch-size">Batch Size (L)</label>
                <input type="number" id="bp-recipe-batch-size" class="bp-input" step="0.1" min="0" inputmode="decimal" />
              </div>
              <div class="bp-recipes-form-field">
                <label for="bp-recipe-abv">ABV (%)</label>
                <input type="number" id="bp-recipe-abv" class="bp-input" step="0.1" min="0" inputmode="decimal" />
              </div>
              <div class="bp-recipes-form-field">
                <label for="bp-recipe-ibu">IBU</label>
                <input type="number" id="bp-recipe-ibu" class="bp-input" step="1" min="0" inputmode="numeric" />
              </div>
              <div class="bp-recipes-form-field">
                <label for="bp-recipe-colour-srm">Colour (SRM)</label>
                <input type="number" id="bp-recipe-colour-srm" class="bp-input" step="1" min="0" inputmode="numeric" />
              </div>
            </div>

            <!-- Pricing -->
            <h3 class="bp-recipes-section-heading">Pricing</h3>
            <div class="bp-recipes-form-grid bp-recipes-form-grid--narrow">
              <div class="bp-recipes-form-field">
                <label for="bp-recipe-pricing-mode">Pricing Mode</label>
                <select id="bp-recipe-pricing-mode" class="bp-select">
                  <option value="locked">Locked Price</option>
                  <option value="dynamic">Ingredient-Based</option>
                </select>
              </div>
              <div class="bp-recipes-form-field">
                <label for="bp-recipe-locked-price">Locked Price ($)</label>
                <input type="number" id="bp-recipe-locked-price" class="bp-input" step="0.01" min="0" inputmode="decimal" />
              </div>
              <div class="bp-recipes-form-field">
                <label for="bp-recipe-service-fee">Service Fee ($)</label>
                <input type="number" id="bp-recipe-service-fee" class="bp-input" step="0.01" min="0" value="45" inputmode="decimal" />
              </div>
              <div class="bp-recipes-form-field">
                <label for="bp-recipe-materials-fee">Materials Fee ($)</label>
                <input type="number" id="bp-recipe-materials-fee" class="bp-input" step="0.01" min="0" value="5" inputmode="decimal" />
              </div>
            </div>

            <!-- Status -->
            <div class="bp-recipes-form-grid bp-recipes-form-grid--narrow">
              <div class="bp-recipes-form-field">
                <label for="bp-recipe-status">Status</label>
                <select id="bp-recipe-status" class="bp-select">
                  <option value="draft">Draft</option>
                  <option value="active">Active</option>
                  <option value="inactive">Inactive</option>
                </select>
                <span id="bp-recipe-status-error" class="bp-recipes-inline-error" role="alert"></span>
              </div>
            </div>

            <!-- Ingredients -->
            <div class="bp-panel-header" style="margin-top:var(--sp-4,16px);">
              <h3 class="bp-recipes-section-heading">Ingredients</h3>
              <button type="button" class="btn-secondary" id="bp-recipes-add-ingredient-btn">+ Add Ingredient</button>
            </div>
            <div id="bp-recipes-ingredients-editor">
              <table class="bp-recipes-table bp-recipes-ing-table">
                <thead>
                  <tr>
                    <th>Ingredient</th>
                    <th>Qty</th>
                    <th>Unit</th>
                    <th>Cost</th>
                    <th>Retail</th>
                    <th>Stock</th>
                    <th>Status</th>
                    <th></th>
                  </tr>
                </thead>
                <tbody id="bp-recipe-ing-tbody"></tbody>
                <tfoot id="bp-recipe-ing-tfoot"></tfoot>
              </table>
              <p class="bp-empty-state" id="bp-recipe-ing-empty">No ingredients added yet.</p>
            </div>

            <!-- Actions -->
            <div class="bp-recipes-detail-actions">
              <button type="button" class="btn" id="bp-recipes-save-btn">Save Recipe</button>
              <button type="button" id="bp-recipe-activate" class="btn" disabled title="">Activate</button>
              <button type="button" id="bp-recipe-clone" class="btn-secondary" style="display:none;">Clone</button>
              <button type="button" id="bp-recipe-delete" class="btn-secondary bp-btn--danger" style="display:none;">Delete</button>
            </div>

          </div><!-- /.bp-recipes-editor-inner -->
        </div><!-- /#bp-recipes-detail-view -->

      </div>

    </div><!-- /.bp-panels -->

    <!-- Bottom tab bar -->
    <nav class="bp-tab-bar" aria-label="Main navigation">
      <button type="button" class="bp-tab active" data-tab="dashboard" aria-label="Dashboard" aria-pressed="true">
        <span class="bp-tab-icon" aria-hidden="true">&#127968;</span>
        <span class="bp-tab-label">Dashboard</span>
      </button>
      <button type="button" class="bp-tab" data-tab="batches" aria-label="Batches" aria-pressed="false">
        <span class="bp-tab-icon" aria-hidden="true">&#127863;</span>
        <span class="bp-tab-label">Batches</span>
      </button>
      <button type="button" class="bp-tab" data-tab="tasks" aria-label="Tasks" aria-pressed="false">
        <span class="bp-tab-icon" aria-hidden="true">&#9989;</span>
        <span class="bp-tab-label">Tasks</span>
      </button>
      <button type="button" class="bp-tab" data-tab="measurements" aria-label="Measurements" aria-pressed="false">
        <span class="bp-tab-icon" aria-hidden="true">&#128202;</span>
        <span class="bp-tab-label">Readings</span>
      </button>
      <button type="button" class="bp-tab" data-tab="recipes" aria-label="Recipes" aria-pressed="false">
        <span class="bp-tab-icon" aria-hidden="true">&#128221;</span>
        <span class="bp-tab-label">Recipes</span>
      </button>
    </nav>

  </div><!-- /#bp-app -->

</body>
</html>
